<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>四川外国语大学商务英语学院 | 用户登录</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            height: 100vh;
            width: 100%;
            background-image: url('fontgate.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 35, 55, 0.55);
            backdrop-filter: blur(2px);
            z-index: 1;
        }

        .login-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            padding: 1.5rem;
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* 玻璃卡片 */
        .login-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 28px;
            padding: 2.8rem 2.2rem 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.20);
            box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.35);
            text-align: center;
        }

        .login-card .logo-mini {
            width: 72px;
            height: 72px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
        .login-card .logo-mini img {
            width: 54px;
            height: 54px;
            object-fit: contain;
            border-radius: 12px;
        }

        .login-card h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.2px;
            margin-bottom: 0.2rem;
            text-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .login-card .subtitle {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 2rem;
            letter-spacing: 0.3px;
        }

        /* 表单 */
        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 0.4rem;
            letter-spacing: 0.3px;
        }

        .input-field {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.20);
            border-radius: 16px;
            padding: 0 1rem;
            transition: all 0.25s ease;
        }

        .input-field:focus-within {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 200, 87, 0.6);
            box-shadow: 0 0 0 3px rgba(255, 200, 87, 0.12);
        }

        .input-field i {
            color: rgba(255, 255, 255, 0.55);
            font-size: 1rem;
            width: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .input-field input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            padding: 0.9rem 0.6rem;
            font-size: 0.95rem;
            font-family: inherit;
            color: #ffffff;
        }

        .input-field input::placeholder {
            color: rgba(255, 255, 255, 0.40);
            font-weight: 400;
        }

        .input-field input:-webkit-autofill,
        .input-field input:-webkit-autofill:hover,
        .input-field input:-webkit-autofill:focus {
            -webkit-background-clip: text;
            -webkit-text-fill-color: #ffffff;
            transition: background-color 9999s ease-in-out 0s;
            caret-color: #ffffff;
        }

        /* 登录按钮 */
        .btn-login {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #FFE6B0 0%, #FFC857 100%);
            color: #0d3b66;
            border: none;
            padding: 0.95rem 1.8rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px -6px rgba(255, 200, 87, 0.35);
            text-decoration: none;
            letter-spacing: 0.4px;
            margin-top: 0.8rem;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 28px -8px rgba(255, 200, 87, 0.45);
            background: linear-gradient(135deg, #FFEDC0 0%, #FFD06A 100%);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login i {
            font-size: 1.05rem;
            transition: transform 0.2s;
        }

        .btn-login:hover i {
            transform: translateX(3px);
        }

        /* 页脚返回链接 */
        .back-link {
            margin-top: 1.5rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.8rem;
            text-decoration: none;
            transition: all 0.2s;
        }

        .back-link:hover {
            color: rgba(255, 255, 255, 0.95);
            gap: 10px;
        }

        /* 分割装饰线 */
        .divider-text {
            margin: 1.5rem 0 0.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.7rem;
        }
        .divider-text::before,
        .divider-text::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
        }

        /* 响应式 */
        @media (max-width: 520px) {
            .login-card {
                padding: 2rem 1.4rem;
                border-radius: 22px;
            }
            .login-card h2 {
                font-size: 1.35rem;
            }
            .btn-login {
                padding: 0.85rem 1.2rem;
                font-size: 1rem;
            }
            .input-field input {
                padding: 0.8rem 0.5rem;
                font-size: 0.9rem;
            }
        }

        .error-shake {
            animation: shake 0.35s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%       { transform: translateX(-6px); }
            75%       { transform: translateX(6px); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo-mini">
                <img src="banner.png" alt="川外商英学院徽章" onerror="this.onerror=null; this.innerHTML='<span style=color:white;font-weight:bold;font-size:22px>SISU</span>';">
            </div>

            <h2>欢迎登录</h2>
            <p class="subtitle">四川外国语大学 · 商务英语学院  <br> 商务外贸谈判专用大模型</p>

            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <label><i class="fas fa-user-graduate" style="margin-right:4px;"></i> 用户名</label>
                    <div class="input-field">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="请输入用户名" value="demo_user" autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock" style="margin-right:4px;"></i> 密码</label>
                    <div class="input-field">
                        <i class="fas fa-key"></i>
                        <input type="password" id="password" placeholder="请输入密码" value="••••••" autocomplete="off">
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    登 录 <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="divider-text">商务英语学院 · 语言智能实验室</div>

            <a href="index.html" class="back-link">
                <i class="fas fa-chevron-left"></i> 返回首页
            </a>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const card = document.querySelector('.login-card');
            const btn = document.querySelector('.btn-login');

            if (!username || !password) {
                card.classList.add('error-shake');
                setTimeout(() => card.classList.remove('error-shake'), 400);
                return false;
            }

            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在登录...';
            btn.disabled = true;

            setTimeout(function() {
                window.location.href = 'mainpage.html';
            }, 600);

            return false;
        }

        document.addEventListener('DOMContentLoaded', function() {
            const passwordInput = document.getElementById('password');
            passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleLogin(e);
                }
            });
        });
    </script>
</body>
</html>
